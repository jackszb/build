name: Build sing-box (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '要构建的 sing-box 版本 tag（例如 v1.11.0）'
        required: true
        type: string

env:
  GOOS: linux
  GOARCH: amd64
  CGO_ENABLED: 0

permissions:
  contents: write

jobs:
  build:
    name: Build sing-box ${{ github.event.inputs.version }} (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sing-box source
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ github.event.inputs.version }}
          fetch-depth: 1

      - name: Setup Go (latest stable)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Show Go version
        run: go version

      - name: Assemble build tags (default + with_grpc + with_purego)
        id: tags
        run: |
          set -e
          DEFAULT_TAGS=$(cat release/DEFAULT_BUILD_TAGS)
          echo "官方默认标签: ${DEFAULT_TAGS}"
          # 默认标签中包含 with_naive_outbound，该功能在 Linux amd64 下
          # 需要选择 purego 或 CGO 实现之一。这里不使用 CGO 工具链，
          # 因此显式加上 with_purego 标记（对应官方发布版本的构建方式）。
          FULL_TAGS="${DEFAULT_TAGS},with_grpc,with_purego"
          echo "最终使用标签: ${FULL_TAGS}"
          echo "tags=${FULL_TAGS}" >> "$GITHUB_OUTPUT"

      - name: Load linker flags
        id: ldflags
        run: |
          set -e
          LDFLAGS=$(cat release/LDFLAGS)
          echo "链接器标志: ${LDFLAGS}"
          echo "ldflags=${LDFLAGS}" >> "$GITHUB_OUTPUT"

      - name: Build sing-box binary
        run: |
          mkdir -p dist
          go build \
            -tags "${{ steps.tags.outputs.tags }}" \
            -ldflags "${{ steps.ldflags.outputs.ldflags }}" \
            -o dist/sing-box \
            ./cmd/sing-box

      - name: Download libcronet.so (required at runtime for with_purego naive outbound)
        id: cronet
        continue-on-error: true
        run: |
          API_URL="https://api.github.com/repos/sagernet/cronet-go/releases/latest"
          echo "查询: ${API_URL}"
          ASSET_URL=$(curl -sL "$API_URL" \
            | grep "browser_download_url" \
            | grep -i "linux_amd64" \
            | grep -i "purego\|\.so" \
            | head -n1 \
            | cut -d '"' -f4)
          if [ -z "$ASSET_URL" ]; then
            echo "::warning::未能自动匹配到 linux_amd64 的 libcronet.so 资源，请到 https://github.com/sagernet/cronet-go/releases 手动下载并放到二进制同目录后再使用 naive 出站功能。构建本身不受影响。"
            exit 0
          fi
          echo "下载: ${ASSET_URL}"
          curl -sL -o dist/libcronet.so "$ASSET_URL"
          ls -la dist/

      - name: Verify binary
        run: |
          file dist/sing-box
          ./dist/sing-box version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ github.event.inputs.version }}-linux-amd64
          path: dist/sing-box
          if-no-files-found: error

      - name: Package as zip
        id: package
        run: |
          set -e
          cd dist
          ZIP_NAME="sing-box-${{ github.event.inputs.version }}-linux-amd64.zip"
          zip -j "${ZIP_NAME}" sing-box $( [ -f libcronet.so ] && echo libcronet.so )
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          ls -la

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: sing-box ${{ github.event.inputs.version }} (linux/amd64)
          body: |
            自动构建产物：sing-box ${{ github.event.inputs.version }}
            平台：linux/amd64
            构建标记：${{ steps.tags.outputs.tags }}
          files: dist/${{ steps.package.outputs.zip_name }}
          make_latest: true
